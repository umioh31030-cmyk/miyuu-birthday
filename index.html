<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Happy Birthday Miyuu 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#050215;font-family:sans-serif;}

/* ─── SCREENS ─── */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
.screen{opacity:1;transition:opacity 0.8s ease;}
.screen.hidden{opacity:0;pointer-events:none;}

/* ─── OP ─── */
#op{background:#000;cursor:pointer;overflow:hidden;}
#op img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.op-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7vh;}
.tap-hint{
  font-family:'Bangers',cursive;
  font-size:clamp(15px,3.5vw,26px);
  letter-spacing:5px;color:#fff;
  text-shadow:0 0 18px rgba(245,197,24,0.9),0 0 40px rgba(245,197,24,0.5);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:0.35;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}

/* ─── MAIN ─── */
#main{
  background:#050215;
  flex-direction:column;
  overflow:hidden;
}
#main::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 55% at 50% 30%, #1c0a52 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 20% 80%, #0a1a40 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, #0a1a40 0%, transparent 60%);
  pointer-events:none;
}
/* factory floor lines */
#main::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:30%;
  background:repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,0.03) 60px,rgba(255,255,255,0.03) 61px);
  pointer-events:none;
}

.admin-badge{
  display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(255,80,80,0.9);color:#fff;font-size:12px;font-weight:bold;
  padding:4px 14px;border-radius:20px;z-index:300;letter-spacing:1px;
}
.admin-badge.show{display:block;}

.main-header{position:relative;z-index:2;text-align:center;padding:clamp(6px,1.5vh,16px) 0 clamp(3px,0.8vh,10px);}
.main-title{
  font-family:'Bangers',cursive;
  font-size:clamp(18px,4vw,38px);
  color:#f5c518;letter-spacing:3px;
  text-shadow:0 0 25px rgba(245,197,24,0.7),0 2px 4px rgba(0,0,0,0.8);
}
.main-sub{font-size:clamp(10px,1.8vw,15px);color:#7a96c4;margin-top:3px;letter-spacing:1px;}

/* ─── DOOR GRID ─── */
.doors-wrap{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2vw,20px);
  padding:clamp(6px,1.5vw,16px) clamp(10px,2.5vw,28px);
  width:100%;max-width:860px;
}
.door-item{display:flex;flex-direction:column;align-items:center;gap:4px;}

.door-btn{
  width:100%;aspect-ratio:0.62;
  position:relative;cursor:pointer;overflow:hidden;
  border-radius:10px 10px 5px 5px;
  border:3px solid #4a2a0e;
  background:linear-gradient(175deg,#7a3a10 0%,#5a2a0a 50%,#4a2008 100%);
  transition:transform 0.12s,box-shadow 0.3s;
  box-shadow:0 4px 14px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,180,80,0.15),inset -2px 0 6px rgba(0,0,0,0.3);
}
.door-btn::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,0.2) 0%,transparent 15%,transparent 85%,rgba(0,0,0,0.2) 100%);
  pointer-events:none;z-index:1;
}
.door-btn:active{transform:scale(0.95);}
.door-btn.locked{cursor:default;filter:brightness(0.6) saturate(0.4);}
.door-btn.unlocked{
  border-color:#f5c518;
  box-shadow:0 0 0 1px #f5c518,0 0 20px rgba(245,197,24,0.5),0 0 40px rgba(245,197,24,0.2),0 4px 14px rgba(0,0,0,0.7);
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 1px #f5c518,0 0 16px rgba(245,197,24,0.4),0 4px 14px rgba(0,0,0,0.7);}
  50%{box-shadow:0 0 0 1px #f5c518,0 0 32px rgba(245,197,24,0.8),0 0 60px rgba(245,197,24,0.3),0 4px 14px rgba(0,0,0,0.7);}
}

/* door details */
.door-panel-t{position:absolute;top:8%;left:10%;right:10%;height:28%;border:1.5px solid rgba(255,180,80,0.2);border-radius:5px 5px 2px 2px;z-index:1;}
.door-panel-b{position:absolute;top:42%;left:10%;right:10%;bottom:16%;border:1.5px solid rgba(255,180,80,0.2);border-radius:2px;z-index:1;}
.door-knob{position:absolute;bottom:9%;right:15%;width:clamp(7px,1.3vw,12px);height:clamp(7px,1.3vw,12px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe57a,#b8870a);border:1px solid #7a5a00;z-index:2;}
.door-lamp{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:clamp(8px,1.5vw,13px);height:clamp(8px,1.5vw,13px);border-radius:50%;background:#990000;border:1.5px solid #550000;z-index:2;transition:background 0.4s,box-shadow 0.4s;}
.door-btn.unlocked .door-lamp{background:#00ee77;border-color:#007744;box-shadow:0 0 8px #00ee77,0 0 16px rgba(0,238,119,0.4);}
.door-char{position:absolute;bottom:14%;left:0;right:0;height:78%;object-fit:contain;object-position:bottom center;padding:0 6px;opacity:0;transition:opacity 0.5s 0.1s;z-index:2;}
.door-btn.unlocked .door-char{opacity:1;}
.door-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3.5vw,32px);z-index:3;transition:opacity 0.4s;}
.door-btn.unlocked .door-lock{opacity:0;pointer-events:none;}

.door-time{font-family:'Bangers',cursive;font-size:clamp(10px,1.8vw,16px);color:#d4a840;letter-spacing:1px;}
.door-cd{font-size:clamp(8px,1.3vw,12px);color:#5a7aaa;font-family:monospace;min-height:13px;text-align:center;}

/* ─── BGM BTN ─── */
#bgm-btn{
  position:fixed;top:10px;right:10px;z-index:400;
  background:rgba(10,5,32,0.7);border:1px solid rgba(245,197,24,0.4);
  color:#f5c518;font-size:18px;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);transition:background 0.2s;
}
#bgm-btn:active{background:rgba(245,197,24,0.2);}

/* ─── ZOOM OVERLAY ─── */
#zoom-door{
  position:fixed;z-index:80;
  border-radius:10px 10px 5px 5px;
  border:3px solid #f5c518;
  background:linear-gradient(175deg,#7a3a10,#4a2008);
  pointer-events:none;
  display:none;
}
#zoom-door.zooming{
  display:block;
  animation:doorZoom 0.55s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes doorZoom{
  0%{opacity:1;}
  70%{opacity:1;border-radius:4px;}
  100%{top:0!important;left:0!important;width:100vw!important;height:100vh!important;border-radius:0;opacity:0;}
}

/* ─── MODAL ─── */
#modal-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,10,0.6);
  opacity:0;pointer-events:none;transition:opacity 0.35s;
}
#modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{
  position:relative;
  max-width:min(460px,92vw);width:100%;
  max-height:88vh;overflow-y:auto;
  border-radius:18px;border:2px solid rgba(245,197,24,0.6);
  overflow:hidden;
  transform:scale(0.82);transition:transform 0.38s cubic-bezier(0.34,1.4,0.64,1);
  box-shadow:0 0 60px rgba(245,197,24,0.25),0 20px 60px rgba(0,0,0,0.8);
}
#modal-overlay.open .modal-box{transform:scale(1);}
.modal-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,16,0.45) 0%,rgba(0,0,16,0.65) 60%,rgba(0,0,16,0.8) 100%);}
.modal-content{position:relative;z-index:2;padding:clamp(14px,3vw,28px);text-align:center;}
.modal-char-img{
  width:clamp(90px,18vw,160px);height:clamp(90px,18vw,160px);
  object-fit:contain;margin:0 auto 10px;display:block;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,0.7));
}
.modal-time{
  font-family:'Bangers',cursive;
  font-size:clamp(36px,8vw,64px);
  color:#f5c518;letter-spacing:3px;line-height:1;
  text-shadow:0 0 30px rgba(245,197,24,0.7),0 3px 6px rgba(0,0,0,0.9);
}
.modal-place{
  font-family:'Bangers',cursive;
  font-size:clamp(16px,3.5vw,28px);
  color:#fff;letter-spacing:2px;margin:8px 0 6px;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);line-height:1.3;
  white-space:pre-line;
}
.modal-note{
  font-size:clamp(12px,2.2vw,15px);color:#9ab4d8;
  line-height:1.6;margin-bottom:10px;white-space:pre-line;
}
.modal-stars{font-size:clamp(16px,3vw,22px);margin-bottom:14px;letter-spacing:3px;}
.modal-video{width:100%;border-radius:10px;margin:10px 0;aspect-ratio:16/9;}
.modal-close{
  font-family:'Bangers',cursive;
  background:rgba(245,197,24,0.15);
  color:#f5c518;border:1.5px solid rgba(245,197,24,0.5);
  padding:9px 30px;border-radius:50px;font-size:clamp(14px,2.5vw,18px);
  letter-spacing:2px;cursor:pointer;transition:background 0.2s,transform 0.12s;
  margin-top:4px;
}
.modal-close:active{background:rgba(245,197,24,0.3);transform:scale(0.96);}

/* ─── SPARKLE ─── */
@keyframes sparkFly{
  0%{transform:scale(0) rotate(0deg) translate(0,0);opacity:1;}
  100%{transform:scale(1.4) rotate(var(--r)) translate(var(--tx),var(--ty));opacity:0;}
}
.spark{position:fixed;pointer-events:none;font-size:clamp(16px,3vw,24px);animation:sparkFly 0.75s ease-out forwards;z-index:200;}
</style>
</head>

  {id:5,img:"miyuu2",  unlock:new Date("2026-06-15T19:00:00"),time:"19:00",   place:"🎁 Special Time",                  note:"大切な動画を見てほしい。\nそしてプレゼント。\nずっと大好きだよ 💙",stars:"💙💙💙💙💙",  youtube:"YOUTUBE_URL_HERE"},
  {id:6,img:"randall", unlock:new Date("2026-06-16T11:30:00"),time:"翌日 11:30",place:"中華街 &\nPandora 横浜ランドマークタワー",note:"2日目もお楽しみ！\nランドールがこっそり教えてくれた場所 😏",stars:"⭐️⭐️⭐️⭐️⭐️",youtube:null},
];

let isAdmin = false;
let tapCount = 0, tapTimer = null;
const bgm = document.getElementById('bgm');
bgm.volume = 0.4;

// ─── OP TAP ───
document.getElementById('op').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1600);
  if (tapCount >= 5) {
    tapCount = 0;
    const pw = prompt('管理者パスワードを入力');
    if (pw === ADMIN_PASSWORD) { isAdmin = true; startApp(); }
    else if (pw !== null) alert('パスワードが違います');
    return;
  }
  startApp();
});

function startApp() {
  document.getElementById('op').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('bgm-btn').style.display = 'flex';
  bgm.play().catch(()=>{});
  if (isAdmin) document.getElementById('admin-badge').classList.add('show');
  buildDoors();
  setInterval(tickDoors, 1000);
}

function isUnlocked(d) { return isAdmin || new Date() >= d.unlock; }

function fmtCountdown(d) {
  const diff = d.unlock - new Date();
  if (diff <= 0) return '';
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
  if (h >= 24) return `あと${Math.floor(h/24)}日${h%24}時間`;
  if (h > 0) return `あと${h}時間${m}分`;
  return `あと${m}分${s}秒`;
}

function buildDoors() {
  const wrap = document.getElementById('doors-wrap');
  wrap.innerHTML = '';
  DOORS.forEach(d => {
    const open = isUnlocked(d);
    const el = document.createElement('div');
    el.className = 'door-item';
    el.innerHTML = `
      <div class="door-btn ${open?'unlocked':'locked'}" id="db-${d.id}" ${open?`onclick="tapDoor(${d.id},this)"`:''} >
        <div class="door-panel-t"></div>
        <div class="door-panel-b"></div>
        <img class="door-char" src="${open?IMGS[d.img]:''}" id="dc-${d.id}" alt="">
        <div class="door-lock">${open?'':'🔒'}</div>
        <div class="door-knob"></div>
        <div class="door-lamp" id="dl-${d.id}"></div>
      </div>
      <div class="door-time">${d.time}</div>
      <div class="door-cd" id="cd-${d.id}">${open?'🔓 OPEN!':fmtCountdown(d)}</div>`;
    wrap.appendChild(el);
  });
}

function tickDoors() {
  DOORS.forEach(d => {
    const btn = document.getElementById(`db-${d.id}`);
    const cd  = document.getElementById(`cd-${d.id}`);
    if (!btn||!cd) return;
    if (isUnlocked(d)) {
      if (btn.classList.contains('locked')) {
        btn.classList.remove('locked'); btn.classList.add('unlocked');
        document.getElementById(`dc-${d.id}`).src = IMGS[d.img];
        btn.querySelector('.door-lock').textContent = '';
        btn.setAttribute('onclick',`tapDoor(${d.id},this)`);
      }
      cd.textContent = '🔓 OPEN!';
    } else {
      cd.textContent = fmtCountdown(d);
    }
  });
}

// ─── DOOR TAP → ZOOM → MODAL ───
function tapDoor(id, el) {
  const d = DOORS.find(x=>x.id===id);
  if (!d||!isUnlocked(d)) return;
  spawnSparks(el);
  const rect = el.getBoundingClientRect();
  const zd = document.getElementById('zoom-door');
  zd.style.cssText = `top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;height:${rect.height}px;display:block;`;
  // force reflow
  void zd.offsetWidth;
  zd.classList.add('zooming');
  setTimeout(() => {
    zd.classList.remove('zooming');
    zd.style.display = 'none';
    openModal(d);
  }, 560);
}

function openModal(d) {
  document.getElementById('modal-char').src = IMGS[d.img];
  document.getElementById('modal-time').textContent = d.time;
  document.getElementById('modal-place').textContent = d.place.replace(/\\n/g,'\n');
  document.getElementById('modal-note').textContent  = d.note.replace(/\\n/g,'\n');
  document.getElementById('modal-stars').textContent = d.stars;
  const vw = document.getElementById('modal-video-wrap');
  vw.innerHTML = '';
  if (d.youtube && d.youtube !== 'YOUTUBE_URL_HERE') {
    const ytId = d.youtube.match(/(?:v=|youtu\.be\/)([\w-]+)/)?.[1];
    if (ytId) vw.innerHTML = `<iframe class="modal-video" src="https://www.youtube.com/embed/${ytId}?autoplay=1" frameborder="0" allowfullscreen allow="autoplay"></iframe>`;
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-video-wrap').innerHTML = '';
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ─── BGM ───
function toggleBGM() {
  bgm.muted = !bgm.muted;
  document.getElementById('bgm-btn').textContent = bgm.muted ? '🔇' : '🔊';
}

// ─── SPARKLES ───
function spawnSparks(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  ['✨','⭐','🌟','💫','✨','⭐','🌟','💫'].forEach((em,i) => {
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = (i/8)*Math.PI*2;
    const dist = 60+Math.random()*80;
    s.style.cssText = `left:${cx}px;top:${cy}px;--r:${(Math.random()*360).toFixed(0)}deg;--tx:${(Math.cos(angle)*dist).toFixed(0)}px;--ty:${(Math.sin(angle)*dist).toFixed(0)}px;`;
    s.textContent = em;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 800);
  });
}
</script>
